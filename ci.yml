name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run. Saves free-tier minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match this to whatever your Godot version requires at build time.
  # Godot 4.5+ C# Android export has needed the .NET 9 SDK present.
  DOTNET_VERSION: "9.0.x"
  CORE_SOLUTION: WordRoguelike.Core.sln

jobs:
  core:
    name: Core — format, build, test
    runs-on: ubuntu-latest
    # No Godot here on purpose. This is why Core has no engine dependency:
    # the whole rules engine tests in seconds on a bare runner.
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.CORE_SOLUTION }}

      - name: Check formatting
        # Fails the build on unformatted code. Run `dotnet format` locally to fix.
        run: dotnet format ${{ env.CORE_SOLUTION }} --verify-no-changes --severity warn

      - name: Build
        # TreatWarningsAsErrors is set in Directory.Build.props, not here,
        # so local builds and CI builds fail on the same things.
        run: dotnet build ${{ env.CORE_SOLUTION }} --no-restore -c Release

      - name: Test
        run: >
          dotnet test ${{ env.CORE_SOLUTION }}
          --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/**"
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Android export. Manual only until the export path is proven by hand.
  #
  # Do NOT enable this on every push. C# Android export in Godot 4 is still
  # flagged experimental, the runner needs the Godot .NET editor binary, the
  # matching export templates, OpenJDK 17 and the Android SDK, and a signing
  # keystore. Get a signed AAB onto your own phone manually first (Sprint 0,
  # issue #2). Then automate exactly the steps that worked.
  #
  # Required repository secrets before this can run:
  #   ANDROID_KEYSTORE_BASE64   base64 of your release .keystore
  #   ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD
  #
  # Never commit the keystore. Losing it means you can never update the
  # Play Store listing again, so back it up somewhere off this machine.
  # ---------------------------------------------------------------------------
  android-export:
    name: Android AAB (manual)
    runs-on: ubuntu-latest
    needs: core
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # TODO(#2): fill in once the manual export is proven.
      #   - download the Godot .NET editor + export templates for your exact version
      #   - install templates to ~/.local/share/godot/export_templates/<version>/
      #   - decode the keystore from secrets into the workspace
      #   - godot --headless --export-release "Android" build/word-roguelike.aab
      #   - upload the AAB as an artifact
      - name: Not implemented yet
        run: |
          echo "Android export is not automated yet. See issue #2."
          exit 1
