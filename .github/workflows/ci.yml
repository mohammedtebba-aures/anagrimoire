name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run. Saves free-tier minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match this to whatever your Godot version requires at build time.
  DOTNET_VERSION: "9.0.x"
  CORE_SOLUTION: WordRoguelike.Core.sln

jobs:
  core:
    name: Core — format, build, test
    runs-on: ubuntu-latest
    # No Godot here on purpose. This is why Core has no engine dependency:
    # the whole rules engine tests in seconds on a bare runner.
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.CORE_SOLUTION }}

      - name: Check formatting
        # Fails the build on unformatted code. Run `dotnet format` locally to fix.
        run: dotnet format ${{ env.CORE_SOLUTION }} --verify-no-changes --severity warn

      - name: Build
        # TreatWarningsAsErrors is set in Directory.Build.props, not here,
        # so local builds and CI builds fail on the same things.
        run: dotnet build ${{ env.CORE_SOLUTION }} --no-restore -c Release

      - name: Test
        run: >
          dotnet test ${{ env.CORE_SOLUTION }}
          --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/**"
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Desktop export (Windows + Linux). Manual only until the export path is
  # proven by hand (issue #2). Then automate exactly the steps that worked.
  #
  # The runner needs the Godot .NET editor binary and the matching export
  # templates for the exact Godot version recorded in ADR 0003. Both presets
  # export from this Linux runner; no Windows runner is needed.
  # ---------------------------------------------------------------------------
  desktop-export:
    name: Desktop export ${{ matrix.platform }} (manual)
    runs-on: ubuntu-latest
    needs: core
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            preset: "Windows Desktop"
            output: build/windows/Anagrimoire.exe
          - platform: linux
            preset: "Linux"
            output: build/linux/Anagrimoire.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # TODO(#2): fill in once the manual export is proven.
      #   - download the Godot .NET editor + export templates for your exact version
      #   - install templates to ~/.local/share/godot/export_templates/<version>/
      #   - godot --headless --path src/WordRoguelike.Game \
      #       --export-release "${{ matrix.preset }}" ${{ matrix.output }}
      #   - upload the build folder as an artifact
      - name: Not implemented yet
        run: |
          echo "Desktop export (${{ matrix.preset }}) is not automated yet. See issue #2."
          exit 1
